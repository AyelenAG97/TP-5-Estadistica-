<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TP5 - Relación entre variables</title>
        <link rel="stylesheet" href="./assets/variable.css" />
        <link rel="stylesheet" href="./assets/styles.css" />
        <!-- Chart.js (versión 4 fija) para dibujar los gráficos de dispersión -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    </head>
    <body>
        <header class="encabezado">
            <div class="encabezado-texto">
                <p class="materia">Estadística y Probabilidades, TP Nro 5</p>
                <h1>¿Qué variables del clima se mueven juntas?</h1>
            </div>
            <button id="btnCargar" class="boton">Recargar datos</button>
        </header>

        <main>
            <!-- Alertas de texto generadas por main.js (carga / errores) -->
            <section id="alertas" class="alertas" aria-live="polite"></section>

            <!-- Gráfico de barras divergente con el r de los 6 pares (lo genera main.js) -->
            <section class="espectro-seccion" aria-labelledby="titulo-espectro">
                <h2 id="titulo-espectro">Los seis pares, de −1 a +1</h2>
                <div class="espectro-escala" aria-hidden="true">
                    <span>−1</span>
                    <span>0</span>
                    <span>+1</span>
                </div>
                <ol id="espectro" class="espectro"></ol>
            </section>

            <!-- Conclusión: par con la mayor correlación -->
            <section id="conclusion" class="conclusion" hidden></section>


            <!-- Un panel por cada par de variables (los genera main.js) -->
            <section id="cards" class="paneles"></section>

            <!-- Tabla con los datos crudos que devolvió la API -->
            <section class="datos">
                <h2>Datos obtenidos de la API</h2>
                <div class="tabla-scroll">
                    <table id="tablaDatos">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Presión (hPa)</th>
                                <th>Temperatura (°C)</th>
                                <th>Humedad (%)</th>
                                <th>Viento (km/h)</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </main>
        <footer class="footer">
            <p>© 2026 by Matias Rosa, Camila Larsen, Matias Nerli & Ayelen Aguero Garcia</p>
        </footer>

        <script src="main.js"></script>
    </body>
</html>
